<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GK · MIND MAP</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
:root {
  --cyan:   #00e5ff;
  --green:  #00ff88;
  --amber:  #ffaa00;
  --red:    #ff2255;
  --bg:     #030b10;
  --panel:  #060e18;
  --border: #0c2535;
  --dim:    #1a4a5e;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--cyan);
  font-family: 'Courier New', Courier, monospace; }

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px,
    rgba(0,229,255,0.01) 2px, rgba(0,229,255,0.01) 4px);
  pointer-events: none; z-index: 9000;
}

/* Header */
#header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 46px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.h-back {
  font-size: 10px; letter-spacing: 3px; color: var(--dim);
  text-decoration: none;
  border: 1px solid var(--border); padding: 3px 10px; border-radius: 2px;
  transition: color .2s, border-color .2s;
}
.h-back:hover { color: var(--cyan); border-color: var(--cyan); }
.h-title { font-size: 13px; letter-spacing: 5px; color: var(--cyan); }
.h-hint  { font-size: 10px; letter-spacing: 2px; color: var(--dim); }

/* Layout */
#main {
  display: flex; height: calc(100vh - 46px);
}
#map-wrap {
  flex: 1; position: relative; overflow: hidden;
  transition: flex .3s ease;
}
#map-wrap.detail-open { flex: 0 0 62%; }

/* SVG */
svg { width: 100%; height: 100%; cursor: default; }

/* D3 node labels */
.node-center text { font-size: 14px; font-weight: bold; fill: #030b10; letter-spacing: 1px; }
.node-branch text {
  font-size: 11px; fill: #030b10; font-weight: bold;
  letter-spacing: 0.5px; pointer-events: none;
}
.node-feature text {
  font-size: 9.5px; fill: #c9d1d9; letter-spacing: 0px; pointer-events: none;
}
.node-branch circle, .node-center circle { cursor: pointer; }
.node-branch circle:hover { filter: brightness(1.25); }
.node-feature circle { cursor: default; }

/* Link lines */
.link-branch { fill: none; stroke-width: 2; opacity: 0.55; }
.link-feature { fill: none; stroke-width: 1; opacity: 0.35; }

/* Active ring */
.node-branch.active circle { filter: brightness(1.3); stroke: white; stroke-width: 1.5px; }

/* Detail panel */
#detail {
  width: 0; overflow: hidden;
  background: var(--panel); border-left: 1px solid var(--border);
  transition: width .3s ease;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
#detail.open { width: 38%; min-width: 320px; }

#dp-header {
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.dp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#dp-name { font-size: 13px; letter-spacing: 3px; }
#dp-close {
  margin-left: auto; cursor: pointer;
  font-size: 16px; color: var(--dim);
  line-height: 1; padding: 4px;
}
#dp-close:hover { color: var(--red); }

#dp-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* Stats grid */
.dp-section { font-size: 9px; letter-spacing: 3px; color: var(--dim);
  margin: 16px 0 8px; }
.dp-section:first-child { margin-top: 0; }

.stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 4px;
}
.stat-box {
  background: rgba(0,0,0,.35); border: 1px solid var(--border);
  border-radius: 2px; padding: 8px 10px;
}
.stat-label { font-size: 9px; letter-spacing: 2px; color: #0c2535; margin-bottom: 4px; }
.stat-val   { font-size: 15px; color: var(--cyan); }
.stat-val.ok     { color: var(--green); }
.stat-val.warn   { color: var(--amber); }
.stat-val.danger { color: var(--red); }

/* Feature list */
.feat-list { list-style: none; }
.feat-list li {
  padding: 5px 0; border-bottom: 1px solid #060e18;
  font-size: 11px; color: #6ab0c0;
  display: flex; align-items: flex-start; gap: 8px;
}
.feat-list li::before { content: '·'; color: var(--dim); flex-shrink: 0; }

/* Examples */
.ex-item {
  background: rgba(0,0,0,.4); border: 1px solid var(--border);
  border-radius: 2px; padding: 6px 10px; margin-bottom: 6px;
  font-size: 11px; color: #8ab0b8;
  display: flex; align-items: center; gap: 8px;
}
.ex-item::before { content: '›'; color: var(--dim); }

/* Loading spinner */
.dp-loading {
  display: flex; align-items: center; gap: 10px;
  color: var(--dim); font-size: 11px; letter-spacing: 2px;
  padding: 20px 0;
}
.dp-loading::before {
  content: '◈'; animation: spin 1s linear infinite;
  color: var(--cyan);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* GraphQL badge */
.gql-badge {
  display: inline-block; font-size: 9px; letter-spacing: 1px;
  padding: 2px 6px; background: rgba(0,229,255,.08);
  border: 1px solid rgba(0,229,255,.2); border-radius: 2px;
  color: var(--dim); margin-bottom: 8px;
}
</style>
</head>
<body>

<div id="header">
  <a class="h-back" href="/">← DASHBOARD</a>
  <div class="h-title">◈ ARCHITECTURE MIND MAP</div>
  <div class="h-hint">CLICK MODULE TO EXPLORE</div>
</div>

<div id="main">
  <div id="map-wrap">
    <svg id="svg"></svg>
  </div>
  <div id="detail">
    <div id="dp-header">
      <div class="dp-dot" id="dp-dot"></div>
      <div id="dp-name">MODULE</div>
      <div id="dp-close" onclick="closeDetail()">✕</div>
    </div>
    <div id="dp-body"></div>
  </div>
</div>

<script>
'use strict';

let branches = [];
let activeBranch = null;
let svg, g, W, H, cx, cy;

const COLORS = {
  farming: '#3fb950', finance: '#f78166', health: '#ff7b72',
  diary: '#d2a8ff', dashboard: '#79c0ff', security: '#ffa657',
  core: '#bc8cff', apis: '#56d364',
};

// ── Layout constants ──────────────────────────────────────────────────────────

function dims() {
  const wrap = document.getElementById('map-wrap');
  return { W: wrap.clientWidth, H: wrap.clientHeight };
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  const res = await fetch('/api/mindmap');
  const data = await res.json();
  branches = data.branches;

  // Attach state
  branches.forEach((b, i) => {
    b._angle = i * (360 / branches.length);  // degrees
    b._open  = false;
  });

  buildSVG();
  window.addEventListener('resize', () => { buildSVG(); });
}

// ── SVG Build ─────────────────────────────────────────────────────────────────

function buildSVG() {
  const d = dims();
  W = d.W; H = d.H;
  cx = W / 2; cy = H / 2;

  const branchR = Math.min(W, H) * 0.27;
  const childR  = Math.min(W, H) * 0.46;

  d3.select('#svg').selectAll('*').remove();

  svg = d3.select('#svg').attr('viewBox', `0 0 ${W} ${H}`);
  g   = svg.append('g').attr('transform', `translate(${cx},${cy})`);

  // ── Glow filter ──
  const defs = svg.append('defs');
  const filter = defs.append('filter').attr('id', 'glow');
  filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const feMerge = filter.append('feMerge');
  feMerge.append('feMergeNode').attr('in', 'blur');
  feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

  // ── Center node ──
  const center = g.append('g').attr('class', 'node-center');
  center.append('circle')
    .attr('r', 58)
    .attr('fill', '#58a6ff')
    .attr('filter', 'url(#glow)')
    .style('cursor', 'default');
  center.append('text').attr('y', -8).attr('text-anchor', 'middle')
    .text('GK');
  center.append('text').attr('y', 8).attr('text-anchor', 'middle')
    .attr('font-size', '9px').attr('fill', '#030b10').text('Personal');
  center.append('text').attr('y', 22).attr('text-anchor', 'middle')
    .attr('font-size', '9px').attr('fill', '#030b10').text('Assistant');

  // ── Subtle ring ──
  g.append('circle').attr('r', branchR)
    .attr('fill', 'none').attr('stroke', '#0c2535').attr('stroke-width', 1)
    .attr('stroke-dasharray', '3,6');

  // Pre-compute branch positions
  branches.forEach(b => {
    const rad = b._angle * Math.PI / 180;
    b._bx = Math.cos(rad) * branchR;
    b._by = Math.sin(rad) * branchR;

    // Child positions (fanned around branch angle)
    const n = b.children.length;
    const spread = Math.min(55, n * 7);
    const startA = b._angle - spread / 2;
    const step   = n > 1 ? spread / (n - 1) : 0;
    b._cx_arr = b.children.map((_, i) => {
      const a = (startA + i * step) * Math.PI / 180;
      return { x: Math.cos(a) * childR, y: Math.sin(a) * childR, label: b.children[i] };
    });
  });

  // ── Links: center → branches ──
  branches.forEach(b => {
    g.append('path')
      .attr('class', 'link-branch')
      .attr('stroke', b.color)
      .attr('d', bezier(0, 0, b._bx, b._by));
  });

  // ── Feature links (hidden initially) ──
  branches.forEach(b => {
    const lg = g.append('g').attr('class', `feat-links feat-${b.id}`)
      .style('opacity', 0).style('pointer-events', 'none');
    b._cx_arr.forEach(child => {
      lg.append('path')
        .attr('class', 'link-feature')
        .attr('stroke', b.color)
        .attr('d', bezier(b._bx, b._by, child.x, child.y));
    });
  });

  // ── Feature nodes (hidden initially) ──
  branches.forEach(b => {
    const ng = g.append('g').attr('class', `feat-nodes feat-${b.id}`)
      .style('opacity', 0).style('pointer-events', 'none');
    b._cx_arr.forEach(child => {
      const fn = ng.append('g').attr('class', 'node-feature')
        .attr('transform', `translate(${child.x},${child.y})`);
      fn.append('rect')
        .attr('x', -60).attr('y', -11)
        .attr('width', 120).attr('height', 22)
        .attr('rx', 3)
        .attr('fill', '#0d1117')
        .attr('stroke', b.color)
        .attr('stroke-width', 0.8)
        .attr('opacity', 0.88);
      fn.append('text').attr('text-anchor', 'middle').attr('dy', 4)
        .text(truncate(child.label, 22));
    });
  });

  // ── Branch nodes (on top) ──
  branches.forEach(b => {
    const bn = g.append('g')
      .attr('class', `node-branch ${b._open ? 'active' : ''}`)
      .attr('id', `bn-${b.id}`)
      .attr('transform', `translate(${b._bx},${b._by})`)
      .style('cursor', 'pointer')
      .on('click', () => onBranchClick(b));

    bn.append('circle').attr('r', 46)
      .attr('fill', b.color)
      .attr('filter', 'url(#glow)');

    // Word-wrap label
    const words = b.label.split(' ');
    if (words.length <= 2) {
      bn.append('text').attr('class', 'node-branch text')
        .attr('text-anchor', 'middle').attr('dy', 4).text(b.label);
    } else {
      const line1 = words.slice(0, Math.ceil(words.length / 2)).join(' ');
      const line2 = words.slice(Math.ceil(words.length / 2)).join(' ');
      bn.append('text').attr('class', 'node-branch text')
        .attr('text-anchor', 'middle').attr('dy', -4).text(line1);
      bn.append('text').attr('class', 'node-branch text')
        .attr('text-anchor', 'middle').attr('dy', 10).text(line2);
    }
  });
}

// ── Bezier path helper ────────────────────────────────────────────────────────

function bezier(x0, y0, x1, y1) {
  const mx = (x0 + x1) / 2 * 0.55;
  const my = (y0 + y1) / 2 * 0.55;
  return `M${x0},${y0} Q${mx},${my} ${x1},${y1}`;
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

// ── Click handler ─────────────────────────────────────────────────────────────

function onBranchClick(b) {
  const wasOpen = b._open;

  // Collapse all others
  branches.forEach(br => {
    if (br.id !== b.id && br._open) {
      br._open = false;
      collapseFeatures(br);
      d3.select(`#bn-${br.id}`).classed('active', false);
    }
  });

  b._open = !wasOpen;
  d3.select(`#bn-${b.id}`).classed('active', b._open);

  if (b._open) {
    expandFeatures(b);
    showDetail(b);
  } else {
    collapseFeatures(b);
    closeDetail();
  }
}

function expandFeatures(b) {
  d3.selectAll(`.feat-links.feat-${b.id}, .feat-nodes.feat-${b.id}`)
    .transition().duration(350)
    .style('opacity', 1)
    .style('pointer-events', null);
}

function collapseFeatures(b) {
  d3.selectAll(`.feat-links.feat-${b.id}, .feat-nodes.feat-${b.id}`)
    .transition().duration(250)
    .style('opacity', 0)
    .style('pointer-events', 'none');
}

// ── Detail panel ──────────────────────────────────────────────────────────────

function showDetail(b) {
  activeBranch = b;
  document.getElementById('map-wrap').classList.add('detail-open');
  document.getElementById('detail').classList.add('open');
  document.getElementById('dp-name').textContent  = b.label.toUpperCase();
  document.getElementById('dp-dot').style.background = b.color;
  document.getElementById('dp-dot').style.boxShadow = `0 0 8px ${b.color}`;

  const body = document.getElementById('dp-body');
  body.innerHTML = '<div class="dp-loading">LOADING LIVE DATA</div>';

  // Fetch GraphQL data if available
  if (b.graphql) {
    fetchGraphQL(b.graphql).then(data => renderDetail(b, data)).catch(() => renderDetail(b, null));
  } else {
    renderDetail(b, null);
  }
}

function closeDetail() {
  if (activeBranch) {
    activeBranch._open = false;
    collapseFeatures(activeBranch);
    d3.select(`#bn-${activeBranch.id}`).classed('active', false);
    activeBranch = null;
  }
  document.getElementById('map-wrap').classList.remove('detail-open');
  document.getElementById('detail').classList.remove('open');
}

async function fetchGraphQL(query) {
  const res = await fetch('/graphql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query }),
  });
  const json = await res.json();
  return json.data || {};
}

function renderDetail(b, gdata) {
  const body = document.getElementById('dp-body');
  let html = '';

  if (gdata && b.graphql) {
    html += `<div class="gql-badge">◈ LIVE VIA GRAPHQL</div>`;
    html += '<div class="dp-section">LIVE STATS</div>';
    html += '<div class="stat-grid">';
    html += renderGQLStats(b.id, gdata);
    html += '</div>';
  }

  html += '<div class="dp-section">FEATURES</div>';
  html += '<ul class="feat-list">';
  b.children.forEach(c => { html += `<li>${escH(c)}</li>`; });
  html += '</ul>';

  if (b.examples && b.examples.length) {
    html += '<div class="dp-section">TRY IN TERMINAL</div>';
    b.examples.forEach(ex => { html += `<div class="ex-item">${escH(ex)}</div>`; });
  }

  body.innerHTML = html;
}

// ── GraphQL stat rendering ────────────────────────────────────────────────────

function statBox(label, val, cls) {
  return `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-val ${cls||''}">${val}</div></div>`;
}

function renderGQLStats(id, data) {
  switch (id) {
    case 'farming': {
      const f = data.farming || {};
      return statBox('PLOTS',        f.plotsCount        ?? '--') +
             statBox('CROPS',        f.cropsCount        ?? '--') +
             statBox('SPRAY LOGS',   f.sprayLogsCount    ?? '--') +
             statBox('OBSERVATIONS', f.observationsCount ?? '--');
    }
    case 'finance': {
      const f = data.finance || {};
      const income = f.currentMonthIncome != null ? `₹${(f.currentMonthIncome/1000).toFixed(1)}k` : '--';
      const spend  = f.currentMonthSpend  != null ? `₹${(f.currentMonthSpend /1000).toFixed(1)}k` : '--';
      return statBox('THIS MONTH INCOME', income,  'ok')   +
             statBox('THIS MONTH SPEND',  spend,   'warn') +
             statBox('TRANSACTIONS',      f.transactionsCount ?? '--') +
             statBox('BUDGETS / GOALS',   `${f.budgetsCount??'--'} / ${f.goalsCount??'--'}`);
    }
    case 'health': {
      const h = data.health || {};
      const bp = h.lastBp || '--';
      const stepsVal = h.lastSteps != null ? h.lastSteps.toLocaleString() : '--';
      return statBox('LAST BP',     bp) +
             statBox('LAST STEPS',  stepsVal) +
             statBox('WEIGHT',      h.lastWeight != null ? h.lastWeight + ' kg' : '--') +
             statBox('READINGS',    h.readingsCount ?? '--');
    }
    case 'dashboard':
    case 'core': {
      const s = data.system || {};
      const w = data.weather || {};
      const cpu  = s.cpuPct  != null ? `${s.cpuPct}%`  : '--';
      const ram  = s.ramPct  != null ? `${s.ramPct}%`  : '--';
      const swap = s.swapPct != null ? `${s.swapPct}%` : '--';
      let html = statBox('CPU',    cpu,  cpuCls(s.cpuPct))  +
                 statBox('RAM',    ram,  barCls(s.ramPct))  +
                 statBox('SWAP',   swap, barCls(s.swapPct)) +
                 statBox('UPTIME', s.uptime || '--');
      if (w.tempC) html += statBox('TEMP', w.tempC+'°C') + statBox('WEATHER', w.description || '--');
      return html;
    }
    case 'security': {
      const g = data.guardian || {};
      const oc = g.overall === 'ok' ? 'ok' : g.overall === 'warn' ? 'warn' : 'danger';
      const oLabel = g.overall === 'ok' ? 'ALL CLEAR' : g.overall === 'warn' ? 'ATTENTION' : 'ALERT';
      return statBox('STATUS',       oLabel,           oc) +
             statBox('ANOMALIES',    g.alertCount   ?? '--', g.alertCount   ? 'danger' : 'ok') +
             statBox('CVEs',         g.vulnCount    ?? '--', g.vulnCount    ? 'warn'   : 'ok') +
             statBox('CODE ISSUES',  g.auditIssues  ?? '--', g.auditCritical ? 'danger' : g.auditIssues ? 'warn' : 'ok');
    }
    case 'apis': {
      const w = data.weather || {};
      return statBox('TEMP',       w.tempC       ? w.tempC+'°C'    : '--') +
             statBox('HUMIDITY',   w.humidity    ? w.humidity+'%'  : '--') +
             statBox('WIND',       w.windKmh     ? w.windKmh+' km/h' : '--') +
             statBox('DATA AGE',   w.ageMin != null ? w.ageMin+'m' : '--') +
             statBox('LOCATION',   w.location    || '--') +
             statBox('STATUS',     w.tempC ? 'LIVE' : 'OFFLINE', w.tempC ? 'ok' : 'danger');
    }
    default: return '';
  }
}

function cpuCls(v) { return v > 85 ? 'danger' : v > 60 ? 'warn' : 'ok'; }
function barCls(v) { return v > 85 ? 'danger' : v > 60 ? 'warn' : '';   }

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
